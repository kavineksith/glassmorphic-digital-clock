name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, master]
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN is what gives the workflow permission to push to the
# gh-pages branch / publish to the Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time — cancel any in-flight run when a new
# push comes in, so we don't publish stale builds over fresh ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build CSS + stage site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies (sass)
        run: npm install

      - name: Compile SCSS → CSS (expanded + minified)
        run: |
          npm run build:css
          npm run build:css:min

      - name: Ensure dist/digital-clock.js is up to date
        run: npm run build:js

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage site into ./_site
        # The demo is just index.html + dist/. Copy both to _site (the
        # folder the upload-pages-artifact action expects).
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R dist _site/
          # include the README so visitors browsing the published repo can
          # find docs, but NOT src/ (source code, not needed for the demo)
          cp README.md _site/
          cp LICENSE _site/
          echo "Staged site:"
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # The deploy job runs in the github-pages environment, which GitHub
    # manages automatically. No extra config needed.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
